# Local rpmlint overrides for the PiDP-1 package.
#
#   make rpmlint RPM_DIR=/tmp/rpb
#
# (RPMs only - see the Makefile for why the bare spec is not an argument.)
# Each filter below is a known false positive or a recorded state of the
# package; none hides a defect, and each says when it can go. The spec header
# summarises the same list for whoever reads the spec instead of the tree.

# rpmlint config files are flat key = value TOML (like
# /etc/xdg/rpmlint/fedora.toml), so Filters must not be nested in a section.
Filters = [
    # Machine vocabulary, not typos: this is a 1960 computer (DEC manuals,
    # the AI Lab memos). Matched on the quoted token only, so a genuine typo
    # elsewhere still reports.
    # gpiochip/libgpiod/newpanel/udev/sudoers: hardware and OS vocabulary
    # the man pages and comments use; rpmlint's dictionary has no idea.
    ".*spelling-error \\('(am1|ad1|dpy|env|fiodec|fstool|gpiochip|iot|libgpiod|mactoam1|microtape|mtp|newpanel|ovlload|pdp|pidp|soroban|src|sudoers|tapevis|type550|udev)'.*",

    # The per-program Makefiles assemble their own compile lines (that is
    # how the tree has always built, and why -march=native needed an
    # ARCHFLAGS escape hatch for the packager); they ignore %optflags'
    # -fpie. Making the whole tree PIE is a flags refactor across twenty
    # makefiles, not a packaging change. Revisit per program as its Makefile
    # learns to honour CC/CFLAGS.
    '.*position-independent-executable-suggested .*',

    # pidp1 is the new cabinet operator group created by sysusers.d (the
    # Fedora guidelines' way). The old line named pidp1-mods, which only
    # ever matched because the gid and the paths shared the name; keep the
    # shape honest. Drop when the name is in rpmlint's users-groups list,
    # /etc/xdg/rpmlint/users-groups.toml.
    '.*non-standard-gid .*pidp1.*',

    # Man pages: the three front doors ship their own (man/pdp1.1,
    # man/pdp1control.1, man/pidp1-test.1). What is left has no page because it has no
    # interface of its own: the tools are documented in Docs/ and
    # self-describe with usage errors, the dialogs and helpers are what
    # pdp1central and pdp1control call. Drop an entry when a real page
    # exists.
    # pidp1-test has its own page (man/pidp1-test.1); the raw pidp1_test it
    # runs has none because it is the page's second paragraph.
    '.*no-manual-page-for-binary (ad1|am1|asr33tape|decode_fiodec|disassemble|docviewer|drumlist|drumupdater|encode_fiodec|fastload|fstool|mactoam1|macro1|macro1_1|mkmicrotape|mtp|ovlload|pdp1audio|pdp1central|pidp1_test|scanpf|t30dpy|tapevis|tape_visualizer|tkaskopenfile|tkaskopenfilewrite)($| .*)',

    # The Exec= lines open a terminal emulator (lxterminal) and telnet that
    # are Requires of the main package - a desktop box must get the icons
    # without pulling LXDE on its own, and the entry points they run live
    # in /usr/share/pidp1-mods/bin, owned by this package.
    '.*desktopfile-without-binary .*(lxterminal|telnet|nohup)($| .*)',

    # The versioned group(pidp1)/user(pidp1) provides come from the
    # sysusers fragment, the unversioned duplicates from the file-owner
    # generators; the package must own the state dirs and name the group,
    # so no spec change removes the second one.
    '.*useless-provides (group\(pidp1\)|user\(pidp1\)).*',

    # Release carries the snapshot segment (srcdate) and the dist tag that a
    # hand-written changelog entry cannot know; the version and release
    # number match. The alternatives are %autochangelog (hides the curated
    # entries) or editing the changelog on every build.
    '.*incoherent-version-in-changelog .*1\.0-[0-9]+\.[0-9]{8}.*',

    # Source0 has no URL because there is nothing to download: it is a git
    # archive of this repository, made at the top of the build by
    # packaging/build-rpm.sh (or by COPR's clone). Pointing it at a tarball
    # nobody uploads would make the SRPM claim a source it cannot verify.
    '.*invalid-url Source0: .*\.tar\.gz.*',

    # FunStuff/ and Diagnostics/ ship their C sources on purpose: they are
    # programs the user assembles on the machine (the install script's "make
    # in the Demo or other program directories" step), not headers and
    # objects for anything to link against.
    '.*devel-file-in-non-devel-package .*/usr/share/pidp1-mods/(FunStuff|Diagnostics)/.*',

    # /etc/sudoers.d/pidp1-mods is 0440 root:root by design - sudo reads it
    # as root and 0440 is how Fedora packages ship sudoers entries - and
    # rpmlint's non-readable check has no sudoers.d exception. Same for the
    # matching non-conffile-in-etc: it is a %config(noreplace) file now.
    '.*non-readable .*/etc/sudoers\.d/pidp1-mods 440.*',

    # The one %post copy runs guarded: cp -a only when pdp23drum is absent,
    # so the "dangerous" overwrite scenario cannot happen. The alternative -
    # install -m644 from the package every upgrade - is what the guard
    # exists to avoid: the drum image is the user's data.
    '.*dangerous-command-in-%post cp.*',

    # The tape library carries historical copies of the same image (a
    # dpys5.rim in tapes/, tapes/old/ and tapes/music/, assembler sources
    # beside their binaries). That is curation of a historical collection,
    # not packaging duplication: bootcfg/*.cfg and the front panel's habits
    # name those exact paths. Invisible while the library lived under
    # /usr/share - rpmlint checks duplicates under /var - and harmless
    # there: 9.4M of a museum's shelves, not two build products.
    '.*files-duplicate .*/var/lib/pidp1-mods/tapes/.*',

    # The vendored gorilla/websocket keeps its notice beside its sources
    # (modules.txt requires the tree as go mod vendor wrote it) and a second
    # copy travels under /usr/share/licenses; same file twice is the
    # price of keeping the vendor tree pristine.
    '.*files-duplicate .*/vendor/github.com/gorilla/websocket/LICENSE.*',

    # 2775 root:pidp1 on the state directories, /etc/pidp1-mods and the
    # writable Microtapes/Drums is the machine's shared-panel mode: anyone in
    # pidp1 runs pdp1/pdp1central, and the setgid keeps group ownership
    # on new files (the drum image, saved configs, tape images). It matches
    # the tmpfiles fragment exactly, so rpm -V agrees with the modes.
    '.*non-standard-dir-perm .*pidp1-mods.* 2775',

    # 0775 root:pidp1 on the five curated subdirectories of the shipped
    # tape library: the same shared-panel rule one level down, so operators
    # can curate tapes/doc or tapes/sources without root. They cannot carry
    # the setgid bit (their contents are package-owned %config(noreplace)
    # files, not site-dropped data), which is why this line is separate from
    # the 2775 one above.
    '.*non-standard-dir-perm .*pidp1-mods/tapes/(doc|flap|music|old|sources) 775',
]
