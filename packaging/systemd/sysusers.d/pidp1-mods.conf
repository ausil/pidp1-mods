# The service account and operator group of a PiDP-1 cabinet: one name for
# both, pidp1. The group owns the writable parts of a packaged install --
# the state directory, /etc/pidp1-mods (pdp1central saves pidp1.config) and
# the Microtapes/Drums data subdirectories -- the udev rule hands it the
# panel's GPIO nodes, and the sudoers fragment (shipped to
# /etc/sudoers.d/pidp1-mods) lets its members attach to the machine's
# console session. Add the operators who run the machine:
#
#     usermod -aG pidp1 <name>
#
# One u line, no g line: it creates the group pidp1 and the user pidp1 with
# that group as its primary, and that identity is the whole access story --
# nothing named pidp1-mods is a user or a group anywhere. It is also the
# only spelling that works: a u line's second column parses as "-" or a
# number and nothing else - a GIDNAME there dies in the scriptlet with
# "Failed to parse UID: 'pidp1': Invalid argument", even once the group
# exists - and every other arrangement (-, or g + m) leaves a second group
# named after the account behind.
u pidp1 - "PiDP-1 simulator" /var/lib/pidp1-mods /usr/sbin/nologin
