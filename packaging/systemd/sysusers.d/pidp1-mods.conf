# The group that owns the writable parts of a packaged PiDP-1: the state
# directory, /etc/pidp1-mods (pdp1central saves pidp1.config) and the
# Microtapes/Drums data subdirectories. Add the operators who run the panel:
# usermod -aG pidp1-mods <name>
g pidp1-mods -
# The user the boot-time units (pdp1.service and friends) run as: its
# primary group is pidp1-mods, which is all the state, config, and GPIO
# access needs. It has no login shell; only systemd starts it.
u pidp1-mods - "PiDP-1 simulator" /var/lib/pidp1-mods /usr/sbin/nologin
