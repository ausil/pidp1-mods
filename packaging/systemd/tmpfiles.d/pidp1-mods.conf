# What the running machine writes: the Type 23 drum image, coremem, punch.out,
# and the writable tape library and boot configurations. Group-writable so any
# member of pidp1 can run the panel; see the sysusers fragment.
d /var/lib/pidp1-mods          2775 root pidp1 -
d /var/lib/pidp1-mods/tapes    2775 root pidp1 -
d /var/lib/pidp1-mods/bootcfg  2775 root pidp1 -

# screen socket directory for pdp1.service, which sets SCREENDIR here instead
# of using the compiled-in /run/screen: NoNewPrivileges= suppresses the gain
# of screen's setgid bit, and an egid-less screen demands mode 777 on the
# socket directory - not something to force on the 0775 root:screen directory
# the screen RPM owns (its own tmpfiles line would keep winning anyway).
# 0700 pidp1: attach goes through the pidp1-attach wrapper, which runs as
# pidp1 too.
d /run/pidp1                   0755 root   root   -
d /run/pidp1/screen            0700 pidp1  pidp1  -
