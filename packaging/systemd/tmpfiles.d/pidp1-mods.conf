# What the running machine writes: the Type 23 drum image, coremem, punch.out,
# and the writable tape library and boot configurations. Group-writable so any
# member of pidp1-mods can run the panel; see the sysusers fragment.
d /var/lib/pidp1-mods          2775 root pidp1-mods -
d /var/lib/pidp1-mods/tapes    2775 root pidp1-mods -
d /var/lib/pidp1-mods/bootcfg  2775 root pidp1-mods -
